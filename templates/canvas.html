<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #wizard {
            position: absolute;
            left: 50%;
            bottom: -420px;
            transform: translateX(-50%);
            max-height: 75vh;
            width: auto;
            user-select: none;
            pointer-events: none;

            opacity: 0;
            filter: brightness(0.55);
            transition:
                bottom 400ms ease,
                opacity 120ms linear,
                filter 120ms linear;
        }

        #wizard.visible {
            bottom: 0;
        }
    </style>
</head>

<body>
    <img
        id="wizard"
        src="/assets/img/wizard.png"
        alt=""
    >

    <script>
        window.addEventListener("DOMContentLoaded", async () => {
            const wizard = document.getElementById("wizard");

            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            const socket = new WebSocket(
                `${protocol}//${window.location.host}/canvas/{{ token }}/ws`
            );

            socket.binaryType = "arraybuffer";

            const AudioContextClass =
                window.AudioContext ||
                window.webkitAudioContext;

            const audioContext = new AudioContextClass();

            const analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            analyser.connect(audioContext.destination);

            const samples =
                new Uint8Array(analyser.frequencyBinCount);

            let nextAudioStartTime = 0;
            let audioQueue = Promise.resolve();

            let messageActive = false;
            let pendingVoiceEnd = false;
            let leaveTriggered = false;

            async function ensureAudioReady() {
                if (audioContext.state === "suspended") {
                    await audioContext.resume();
                }
            }

            async function decodeAudio(arrayBuffer) {
                return await audioContext.decodeAudioData(arrayBuffer);
            }

            function playBufferAt(audioBuffer, startTime) {
                const source = audioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(analyser);
                source.start(startTime);
                return source;
            }

            async function playOneShot(url) {
                await ensureAudioReady();

                const response = await fetch(url, { cache: "no-store" });
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await decodeAudio(arrayBuffer);

                return await new Promise(resolve => {
                    const source = playBufferAt(
                        audioBuffer,
                        audioContext.currentTime
                    );

                    source.onended = () => resolve();
                });
            }

            async function queueVoiceAudio(arrayBuffer) {
                await ensureAudioReady();

                const audioBuffer = await decodeAudio(arrayBuffer);

                const startTime = Math.max(
                    audioContext.currentTime,
                    nextAudioStartTime
                );

                playBufferAt(audioBuffer, startTime);

                nextAudioStartTime =
                    startTime + audioBuffer.duration;
            }

            function showWizard() {
                wizard.classList.add("visible");
            }

            function hideWizard() {
                wizard.classList.remove("visible");
                wizard.style.opacity = "0.35";
                wizard.style.filter = "brightness(0.55)";
            }

            async function finishMessagePlayback() {
                if (leaveTriggered) {
                    return;
                }

                leaveTriggered = true;
                pendingVoiceEnd = false;

                try {
                    await playOneShot("/assets/audio/skeleton_leave.wav");
                } catch (error) {
                    console.error("failed to play leave sound:", error);
                }

                messageActive = false;
                nextAudioStartTime = audioContext.currentTime;
                hideWizard();
            }

            function render() {
                analyser.getByteFrequencyData(samples);

                let sum = 0;

                for (const sample of samples) {
                    sum += sample;
                }

                const intensity =
                    (sum / samples.length) / 255;

                if (messageActive) {
                    wizard.style.opacity =
                        String(Math.max(0.55, 0.65 + intensity * 0.5));

                    wizard.style.filter =
                        `brightness(${0.8 + intensity * 1.4}) drop-shadow(0 0 ${12 + intensity * 28}px rgba(255,255,255,0.7))`;
                }

                if (
                    pendingVoiceEnd &&
                    messageActive &&
                    !leaveTriggered &&
                    audioContext.currentTime >= nextAudioStartTime - 0.03
                ) {
                    finishMessagePlayback();
                }

                requestAnimationFrame(render);
            }

            socket.addEventListener("open", async () => {
                console.log("canvas websocket connected");

                try {
                    await playOneShot("/assets/audio/incoming_transmission.mp3");
                } catch (error) {
                    console.error("failed to play incoming transmission:", error);
                }
            });

            socket.addEventListener("message", event => {
                if (event.data instanceof ArrayBuffer) {
                    audioQueue = audioQueue
                        .then(() => queueVoiceAudio(event.data))
                        .catch(error => {
                            console.error("failed to queue voice audio:", error);
                        });

                    return;
                }

                try {
                    const message = JSON.parse(event.data);

                    switch (message.type) {
                        case "voice_start":
                            messageActive = true;
                            pendingVoiceEnd = false;
                            leaveTriggered = false;
                            showWizard();
                            console.log("voice generation started");
                            break;

                        case "voice_end":
                            pendingVoiceEnd = true;
                            console.log("voice generation finished");
                            break;

                        default:
                            console.debug("unknown canvas message:", message);
                            break;
                    }
                } catch (error) {
                    console.error("invalid canvas message:", error);
                }
            });

            socket.addEventListener("close", event => {
                console.log(
                    "canvas websocket closed:",
                    event.code,
                    event.reason
                );
            });

            socket.addEventListener("error", error => {
                console.error("canvas websocket error:", error);
            });

            window.addEventListener("beforeunload", () => {
                socket.close(1000, "canvas unloaded");
                audioContext.close();
            });

            render();
        });
    </script>
</body>
</html>
