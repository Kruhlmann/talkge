[package]
name = "talkge"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = "0.3.34"
lazy_static = "1.5.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "form", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
